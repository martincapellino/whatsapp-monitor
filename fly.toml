app = 'whatsapp-monitor'
primary_region = 'gru'

[build]
  [build.args]
    NODE_VERSION = '20'

[mounts]
  source = 'whatsapp_data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = 'off'
  auto_start_machines = true

[[vm]]
  size = 'shared-cpu-1x'